[project]
name = "genzi"
version = "0.1.0"
description = "GenZI: Zero-Shot 3D Human-Scene Interaction Generation"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
    "accelerate==0.21.0",
    "chumpy==0.70",
    "datasets==2.14.2",
    "diffusers[torch]==0.21.0",
    "easydict==1.10",
    "ftfy==6.1.1",
    "glfw==2.5.9",
    "huggingface-hub==0.25.2",
    "imageio==2.26.1",
    "imageio-ffmpeg",
    "iopath==0.1.10",
    "kaleido==0.2.1",
    "loguru==0.6.0",
    "matplotlib==3.7.1",
    "ninja==1.11.1",
    "omegaconf==2.3.0",
    "opencv-contrib-python-headless==4.8.0.74",
    "pandas==1.5.3",
    "pillow==10.0.0",
    "plyfile==0.8.1",
    "protobuf==3.19.6",
    "pyopengl==3.1.0",
    "pyopengl-accelerate==3.1.6",
    "pyrender==0.1.45",
    "regex==2023.3.23",
    "safetensors==0.3.1",
    "scipy==1.8.1",
    "shapely==2.0.1",
    "tensorboardx==2.6",
    "torch==2.0.1",
    "torchgeometry==0.1.2",
    "torchvision==0.15.2",
    "tqdm==4.65.0",
    "transformers==4.31.0",
    "trimesh[easy]",
    "usd-core==26.3",
    "wandb==0.15.8",
]

[dependency-groups]
dev = [
    "black",
    "pytest>=8.3.5",
    "ruff>=0.15.20",
    "usort",
]
generation = [
    "smplx==0.1.28",
    "human-body-prior @ git+https://github.com/nghorbani/human_body_prior.git@4c246d8a83ce16d3cff9c79dcf04d81fa440a6bc",
    "open3d==0.10.0.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'win32' and platform_machine == 'x86_64')",
    "pywinpty==2.0.13; sys_platform == 'win32'",
]

[[tool.uv.index]]
name = "pytorch-cu117"
url = "https://download.pytorch.org/whl/cu117"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu117" }
torchvision = { index = "pytorch-cu117" }

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]
